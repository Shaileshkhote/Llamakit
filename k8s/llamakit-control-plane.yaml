apiVersion: apps/v1
kind: Deployment
metadata:
  name: llamakit-web
  namespace: llamakit-system
  labels:
    app: llamakit-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llamakit-web
  template:
    metadata:
      labels:
        app: llamakit-web
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: web
          image: localhost:5000/llamakit-web:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: llamakit-app-env
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: llamakit-web
  namespace: llamakit-system
  labels:
    app: llamakit-web
spec:
  selector:
    app: llamakit-web
  ports:
    - name: http
      port: 80
      targetPort: 3000
      nodePort: 30080
  type: NodePort
